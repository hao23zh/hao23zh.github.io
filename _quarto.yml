format:
  html:
    theme: cosmo
    css: styles.css
    anchor-sections: false
    toc: true
    footnotes-hover: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    fig-align: center
    link-external-icon: false
    link-external-newwindow: true
    email-obfuscation: javascript
    link-external-filter: '^(?:http:|https:)\/\/hao23zh\.github\.io\/'
